name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard — no 16-digit activation codes in tracked files
        shell: bash
        run: |
          set -euo pipefail
          # The real activation code must never appear in the repository.
          # '1234567890123456' is the documented fake used by format tests.
          hits=$(git grep -nE '[0-9]{16}' -- ':!package-lock.json' | grep -v '1234567890123456' || true)
          if [ -n "$hits" ]; then
            echo "::error::16-digit sequences found — the activation code must never be committed:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK — no 16-digit activation codes in tracked files."

      - name: Lint
        run: npm run lint

      - name: Static audit (no TODO/placeholder/stray console in src)
        run: npm run audit:static

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        env:
          # Optional secret — activation tests fall back to format-only checks when absent.
          DENTIVA_ACTIVATION_SOURCE: ${{ secrets.DENTIVA_ACTIVATION_SOURCE }}
        run: npm test

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (includes Electron runtime)
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Rebuild better-sqlite3 for the Electron ABI (main process requires it at startup)
        run: ./node_modules/.bin/electron-rebuild -f -w better-sqlite3

      - name: Install Electron system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libx11-xcb1 libasound2t64 \
            || sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libx11-xcb1 libasound2

      - name: Playwright E2E (activation gate always; full journey with secret)
        shell: bash
        env:
          DENTIVA_ACTIVATION_SOURCE: ${{ secrets.DENTIVA_ACTIVATION_SOURCE }}
          DEBUG: 'pw:browser*'
        run: |
          set -o pipefail
          xvfb-run -a npm run e2e 2>&1 | tee e2e.log

      - name: E2E failure diagnostics (annotations + check summary)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: 'End-to-end (Electron)'
          # pull_request runs carry the merge SHA in GITHUB_SHA; check-runs live on the head
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          echo "::error::e2e.log exists: $(test -f e2e.log && echo yes || echo no) ($(wc -c < e2e.log 2>/dev/null || echo 0) bytes)"
          if [ -f e2e.log ]; then
            LC_ALL=C sed -e $'s/\x1b\\[[0-9;]*m//g' -e 's/\r//g' e2e.log > clean-e2e.log 2>/tmp/sederr.txt || cp e2e.log clean-e2e.log
            test -s clean-e2e.log || cp e2e.log clean-e2e.log
            if [ -s /tmp/sederr.txt ]; then echo "::error::sed issue: $(head -c 300 /tmp/sederr.txt)"; fi
            # compact single annotation, hard-capped well under the 64KB command limit
            head -c 6000 clean-e2e.log 2>/dev/null | awk 'BEGIN{ORS=""} {printf "%s%s", (NR>1?"%0A":"") substr($0,1,400)}' | head -c 5000 > /tmp/ann.txt || true
            if [ -s /tmp/ann.txt ]; then echo "::error::$(cat /tmp/ann.txt)"; fi
            echo "::error::== missing shared libs =="
            ldd node_modules/electron/dist/electron 2>/dev/null | grep 'not found' | sed 's/^/::error::missing /' || echo "::error::ldd: none missing"
            # full log to a check-run summary (truncated under the 64KB limit)
            CID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=50" \
              -q '[.check_runs[] | select(.conclusion == null)] | first | .id // empty' 2>/dev/null)
            CID="${CID:-$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=50" -q '[.check_runs[] | select(.name == env.CHECK_NAME)] | first | .id // empty' 2>/dev/null)}"
            if [ -n "$CID" ]; then
              { echo '### e2e.log (ANSI-stripped, truncated)'; echo '```'; head -c 58000 clean-e2e.log; echo '```'; } > /tmp/summary.md
              jq -n --rawfile body /tmp/summary.md '{output:{title:"E2E failure log",summary:$body}}' > /tmp/payload.json
              if gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CID" --input /tmp/payload.json >/dev/null 2>/tmp/gherr.txt; then
                echo "::error::check-run summary patched ok (cid=$CID)"
              else
                echo "::error::check-run summary PATCH failed: $(cat /tmp/gherr.txt)"
              fi
            else
              echo "::error::could not resolve check-run id for summary"
            fi
          fi

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
