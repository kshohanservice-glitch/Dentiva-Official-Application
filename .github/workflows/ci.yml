name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard — no 16-digit activation codes in tracked files
        shell: bash
        run: |
          set -euo pipefail
          # The real activation code must never appear in the repository.
          # '1234567890123456' is the documented fake used by format tests.
          hits=$(git grep -nE '[0-9]{16}' -- ':!package-lock.json' | grep -v '1234567890123456' || true)
          if [ -n "$hits" ]; then
            echo "::error::16-digit sequences found — the activation code must never be committed:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK — no 16-digit activation codes in tracked files."

      - name: Lint
        run: npm run lint

      - name: Static audit (no TODO/placeholder/stray console in src)
        run: npm run audit:static

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        env:
          # Optional secret — activation tests fall back to format-only checks when absent.
          DENTIVA_ACTIVATION_SOURCE: ${{ secrets.DENTIVA_ACTIVATION_SOURCE }}
        run: npm test

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (includes Electron runtime)
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Install Electron system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libx11-xcb1 libasound2t64 \
            || sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libx11-xcb1 libasound2

      - name: Playwright E2E (activation gate always; full journey with secret)
        shell: bash
        env:
          DENTIVA_ACTIVATION_SOURCE: ${{ secrets.DENTIVA_ACTIVATION_SOURCE }}
        run: |
          set -o pipefail
          xvfb-run -a npm run e2e 2>&1 | tee e2e.log

      - name: E2E failure diagnostics (annotations)
        if: failure()
        shell: bash
        run: |
          echo "::error::--- e2e log tail ---"
          tail -n 60 e2e.log 2>/dev/null | sed 's/^/::error::/' || echo "::error::no e2e.log produced"
          echo "::error::--- missing shared libraries (if any) ---"
          ldd node_modules/electron/dist/electron 2>/dev/null | grep 'not found' | sed 's/^/::error::missing lib /' || echo "::error::ldd check clean" 

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
